<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07070d" />
    <title>短剧互动</title>
    <style>
      html,
      body {
        margin: 0;
        background: #07070d;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #07070d;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      }

      #boot-splash .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 40px rgba(255, 77, 109, 0.35);
      }

      #boot-splash .logo svg {
        width: 32px;
        height: 32px;
        fill: #07070d;
        margin-left: 4px;
      }

      #boot-splash .title {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      #boot-splash .accent {
        color: #ff4d6d;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>
      <div class="title"><span class="accent">短剧</span>互动</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
